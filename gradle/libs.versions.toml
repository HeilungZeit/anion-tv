[versions]
# Проверено по релиз-нотам на август 2026:
#   AGP 9.3.0 (июль 2026) — требует Gradle ≥ 9.5, JDK ≥ 17, KGP ≥ 2.2.10.
#   Kotlin 2.3.20 — намеренно не 2.4.0: та вышла 11.08.2026, AGP 9.3 старше её.
# Версии ниже без пометки "проверено" — заведомо существующие, но, возможно,
# устаревшие. Android Studio подсветит их прямо в этом файле после первой
# синхронизации, обновлять по одной.
agp = "9.3.0"                    # проверено
kotlin = "2.3.20"                # проверено
composeBom = "2026.06.01"        # проверено
tvMaterial = "1.1.0"             # проверено

coroutines = "1.9.0"
serialization = "1.7.3"
okhttp = "5.4.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
media3 = "1.5.1"
room = "2.8.4"
ksp = "2.3.11"
coil = "2.7.0"
junit = "4.13.2"
kotest = "6.2.3"
turbine = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestExt = "1.2.1"
espresso = "3.6.1"

[libraries]
# --- общее ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# --- UI ---
# tv-foundation больше нет: при стабилизации Compose for TV его содержимое
# (TvLazyColumn/TvLazyRow и прочее) уехало в обычный androidx.compose.foundation.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# --- плеер ---
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }

# --- данные ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# --- тесты ---
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
# В AGP 9 плагин org.jetbrains.kotlin.android больше не применяется:
# Kotlin в Android-модулях включён встроенно (builtInKotlin), поэтому
# kotlin-android здесь нет. А вот compose-плагин по-прежнему обязателен,
# встроенный Kotlin его не заменяет (проверено сборкой).
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }

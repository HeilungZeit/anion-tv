name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed TV release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and calculate Android version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must use strict SemVer format: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( major > 2100 || minor > 999 || patch > 999 )); then
            echo "Version components are too large for Android versionCode" >&2
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode is out of range" >&2
            exit 1
          fi

          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 ANION_KEYSTORE_PASSWORD ANION_KEY_ALIAS ANION_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Required GitHub secret for $value is missing" >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/anion-tv-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "keystore-path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: >-
          ./gradlew --no-daemon
          :core-source:test
          :core-resolve:test
          :core-player:testDebugUnitTest
          :core-data:testDebugUnitTest
          :app:testDebugUnitTest

      - name: Build signed APK and app bundle
        env:
          ANION_REQUIRE_SIGNING: "true"
          ANION_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore-path }}
          ANION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANION_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANION_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release
          version="${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/release/*.apk "release/anion-tv-$version.apk"
          cp app/build/outputs/bundle/release/*.aab "release/anion-tv-$version.aab"
          cd release
          sha256sum "anion-tv-$version.apk" "anion-tv-$version.aab" > "SHA256SUMS.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: anion-tv-${{ steps.version.outputs.name }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/*
          --verify-tag
          --generate-notes
          --title "Anion TV ${{ steps.version.outputs.name }}"

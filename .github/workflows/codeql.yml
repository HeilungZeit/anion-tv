name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Java and Kotlin analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # --no-build-cache обязателен. CodeQL строит базу, наблюдая за реальным
      # запуском компилятора: он видит ровно тот код, который на его глазах
      # скомпилировали. Когда Gradle достаёт результаты из build cache, ни один
      # компилятор не запускается — сборка «успешна» за 19 секунд, а анализ
      # падает с «no source code seen during build».
      #
      # Ловится это не сразу: пока коммит трогает Kotlin, задачи выполняются
      # по-настоящему и всё зелено. Достаточно коммита, который меняет только
      # workflow или README, — исходники те же, всё берётся из кэша, и CodeQL
      # краснеет на ровном месте. Кэш зависимостей при этом остаётся: флаг
      # выключает только переиспользование результатов задач.
      - name: Build analyzed sources
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleDebug

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
